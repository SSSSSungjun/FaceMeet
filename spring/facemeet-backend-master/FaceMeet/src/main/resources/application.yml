firebase:
  service-account:
    path: "/firebase/service-account.json"
  topic-name: testMessage
  project-id: "face-meet-77a06"

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000

event:
  pre-message-minutes: 1
  message-dispatch-minutes: 2
  default-topic-name: event

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: my-redis
      port: 6379
      password: l!e!v!e!l!u!p!
  security:
    oauth2:
      admin:
        kakao:
          admin-key: ${KAKAO_ADMIN_KEY}
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            redirect-uri: "http://i13d201.p.ssafy.io/login/oauth2/code/kakao"
#            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - account_email
              - name
              - gender
              - birthday
              - birthyear

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "http://i13d201.p.ssafy.io/login/oauth2/code/naver"
#            redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email, gender, birthday, birthyear
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization_uri: https://nid.naver.com/oauth2.0/authorize
            token_uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user_name_attribute: response

#s3
cloud:
  aws:
    s3:
      bucket: sanggyeonrye
    stack.auto: false
    region.static: ap-northeast-2
    credentials:
      accessKey: ${S3_ACCESS_KEY}
      secretKey: ${S3_SECRET_KEY}

logging:
  level:
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG