<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        font-family: 'Pretendard', Arial, sans-serif;
        background: #ffffffff; /* 이미지 색상을 예시로 적용 */
        margin: 0;
        padding: 0;
    }
    /* 나머지 스타일 동일 */
</style>
<body>
    <div class="container my-5">
      <h1 class="mb-4 fw-bold">관리자 대시보드</h1>
    
      <nav class="mb-4">
        <a href="{% url 'adminpage:blacklist_list' %}" class="btn btn-outline-primary me-2">블랙리스트 목록</a>
        {% comment %} <a href="{% url 'adminpage:blacklist_list' %}">블랙리스트 목록</a> {% endcomment %}
        <a href="{% url 'adminpage:report_list' %}" class="btn btn-outline-success me-2">신고 내역</a>
        <a href="{% url 'adminpage:setting_list' %}" class="btn btn-outline-warning">이벤트 관리</a>
      </nav>
    
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">총 블랙리스트 등록 수</h5>
              <p class="display-4 mb-0">{{ blacklist_count }}</p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">총 신고 내역 수</h5>
              <p class="display-4 mb-0">{{ report_count }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    
</body>
</html>






<!-- Bootstrap CSS 연결 -->
